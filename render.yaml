services:
  - type: web
    name: bake-bite-by-marjan
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: DB_FILE
        value: /var/data/bakebite.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: bake-bite-data
      mountPath: /var/data
      sizeGB: 1
